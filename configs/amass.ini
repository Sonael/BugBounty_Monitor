; Amass v4 config (formato INI). Veja https://github.com/owasp-amass/amass/blob/master/examples/config.ini
; Sem keys = só fontes públicas (Wayback, CommonCrawl, Certificate Transparency).
;
; Exemplo de keys (descomente e preencha):
;
; [data_sources.SecurityTrails]
; [data_sources.SecurityTrails.Credentials]
; apikey = SECURITYTRAILS_API_KEY
;
; [data_sources.Shodan]
; [data_sources.Shodan.Credentials]
; apikey = SHODAN_API_KEY
;
; [data_sources.Censys]
; [data_sources.Censys.Credentials]
; apikey = CENSYS_API_ID
; secret = CENSYS_API_SECRET
;
; [data_sources.VirusTotal]
; [data_sources.VirusTotal.Credentials]
; apikey = VIRUSTOTAL_API_KEY
;
; [data_sources.GitHub]
; [data_sources.GitHub.Credentials]
; apikey = GITHUB_TOKEN
